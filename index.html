<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Showy — Multi-Vendor E-Commerce Platform</title>

    <!-- SEO -->
    <meta name="description" content="Showy is Bangladesh's multi-vendor marketplace. Shop genuine products from verified sellers with bKash/Nagad OTP payments and cash on delivery — or open your own online shop in minutes." />
    <meta name="keywords" content="Bangladesh ecommerce, multi-vendor marketplace, online shopping BD, bKash payment, Nagad payment, cash on delivery, sell online Bangladesh" />
    <link rel="canonical" href="https://showy.jubair.bond/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Showy" />
    <meta property="og:title" content="Showy — Shop. Sell. Grow." />
    <meta property="og:description" content="Bangladesh's multi-vendor marketplace: verified sellers, nationwide delivery, bKash/Nagad OTP checkout, and a fair 5% commission for vendors." />
    <meta property="og:url" content="https://showy.jubair.bond/" />
    <meta property="og:image" content="https://showy.jubair.bond/icon-512.png" />
    <meta property="og:locale" content="en_BD" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Showy — Shop. Sell. Grow." />
    <meta name="twitter:description" content="Bangladesh's multi-vendor marketplace: verified sellers, nationwide delivery, bKash/Nagad OTP checkout." />
    <meta name="twitter:image" content="https://showy.jubair.bond/icon-512.png" />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Showy" />
    <link rel="apple-touch-icon" href="./icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Structured data: Organization + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://showy.jubair.bond/#org",
          "name": "Showy",
          "url": "https://showy.jubair.bond/",
          "logo": "https://showy.jubair.bond/icon-512.png",
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+880-1863-875033",
            "email": "siddiknurealam1@gmail.com",
            "areaServed": "BD",
            "availableLanguage": ["en", "bn"]
          },
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Gaibandha",
            "addressRegion": "Rangpur",
            "addressCountry": "BD"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://showy.jubair.bond/#site",
          "url": "https://showy.jubair.bond/",
          "name": "Showy",
          "publisher": { "@id": "https://showy.jubair.bond/#org" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://showy.jubair.bond/products?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
